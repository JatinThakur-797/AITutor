name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ApiGateway
          - LearningPathGenerator
          - User-Service
          - AIService
          - ServiceRegistry
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Maven Tests
        working-directory: PersonalAITutorBackend/${{ matrix.service }}
        run: mvn test -B

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: PersonalAITutorFrontend/package-lock.json
      - name: Install & Test
        working-directory: PersonalAITutorFrontend
        run: |
          npm ci
          npm test -- --run
          npm run build