spring.application.name=ApiGateway
spring.config.import=optional:file:.env[.properties],optional:file:PersonalAITutorBackend/ApiGateway/.env[.properties]
server.port=${SERVER_PORT:8080}

app.gateway.secret=${APP_GATEWAY_SECRET:${INTERNAL_SECRET:${APP_INTERNAL_SECRET:}}}
app.jwt.secret=${JWT_SECRET:${APP_JWT_SECRET}}

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=Authorization, Set-Cookie
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Route 1: General API requests
spring.cloud.gateway.routes[0].id=USER-SERVICE-API
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/user/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[0].filters[1]=CircuitBreaker=USER-SERVICE-API,forward:/fallback/user

# Route 2: OAuth2 & Login Redirects
spring.cloud.gateway.routes[1].id=USER-SERVICE-AUTH
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/oauth2/**,/api/auth/**,/login/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[1].filters[1]=CircuitBreaker=USER-SERVICE-AUTH,forward:/fallback/auth

# Route 3: Learning Path Generator
# =========================================
# ROUTE 3: AI MENTOR SSE STREAMING
# =========================================

spring.cloud.gateway.routes[2].id=LEARNING-PATH-CHAT-STREAM

spring.cloud.gateway.routes[2].uri=lb://LEARNING-PATH-GENERATOR

spring.cloud.gateway.routes[2].predicates[0]=Path=/api/path/chat/stream

spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter


# =========================================
# ROUTE 4: NORMAL LEARNING PATH REQUESTS
# =========================================

spring.cloud.gateway.routes[3].id=LEARNING-PATH-GENERATOR

spring.cloud.gateway.routes[3].uri=lb://LEARNING-PATH-GENERATOR

spring.cloud.gateway.routes[3].predicates[0]=Path=/health,/api/path/**

spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[3].filters[1]=CircuitBreaker=LEARNING-PATH-GENERATOR,forward:/fallback/path

spring.cloud.gateway.routes[4].id=AI-SERVICE
spring.cloud.gateway.routes[4].uri=lb://AI-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/helloAI,/api/ai/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter
spring.cloud.gateway.routes[4].filters[1]=CircuitBreaker=AI-SERVICE,forward:/fallback/ai

resilience4j.circuitbreaker.instances.AI-SERVICE.slidingWindowSize=10
resilience4j.circuitbreaker.instances.AI-SERVICE.failureRateThreshold=50
resilience4j.circuitbreaker.instances.AI-SERVICE.waitDurationInOpenState=15s
resilience4j.timelimiter.instances.AI-SERVICE.timeoutDuration=90s

# =========================================
# RESILIENCE4J CIRCUIT BREAKER & TIMELIMITER
# =========================================
resilience4j.circuitbreaker.instances.USER-SERVICE-API.slidingWindowSize=10
resilience4j.circuitbreaker.instances.USER-SERVICE-API.failureRateThreshold=50
resilience4j.circuitbreaker.instances.USER-SERVICE-API.waitDurationInOpenState=15s
resilience4j.timelimiter.instances.USER-SERVICE-API.timeoutDuration=10s

resilience4j.circuitbreaker.instances.USER-SERVICE-AUTH.slidingWindowSize=10
resilience4j.circuitbreaker.instances.USER-SERVICE-AUTH.failureRateThreshold=50
resilience4j.circuitbreaker.instances.USER-SERVICE-AUTH.waitDurationInOpenState=15s
resilience4j.timelimiter.instances.USER-SERVICE-AUTH.timeoutDuration=10s

# AI lesson generation can take materially longer than ordinary API calls.
# Keep this above the LearningPathGenerator Feign read timeout.
resilience4j.circuitbreaker.instances.LEARNING-PATH-GENERATOR.slidingWindowSize=10
resilience4j.circuitbreaker.instances.LEARNING-PATH-GENERATOR.failureRateThreshold=50
resilience4j.circuitbreaker.instances.LEARNING-PATH-GENERATOR.waitDurationInOpenState=15s
resilience4j.timelimiter.instances.LEARNING-PATH-GENERATOR.timeoutDuration=90s

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# =========================================
# TOKEN BUCKET RATE LIMITER
# =========================================
gateway.rate-limit.enabled=true
gateway.rate-limit.capacity=10
gateway.rate-limit.refill-tokens=2
gateway.rate-limit.refill-period=1s
gateway.rate-limit.request-cost=1
gateway.rate-limit.bucket-ttl=2m
gateway.rate-limit.fail-open=false
gateway.rate-limit.key-prefix=aitutor:gateway:rate-limit
gateway.rate-limit.excluded-paths[0]=/health
gateway.rate-limit.excluded-paths[1]=/actuator/health
gateway.rate-limit.excluded-paths[2]=/eureka
gateway.rate-limit.excluded-paths[3]=/fallback

# =========================================
# METRICS & EUREKA
# =========================================
management.server.port=5051
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
