spring.application.name=ApiGateway
server.port=5050
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=Authorization, Set-Cookie
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Route 1: General API requests
spring.cloud.gateway.routes[0].id=USER-SERVICE-API
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path= /api/user/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

# Route 2: OAuth2 & Login Redirects
spring.cloud.gateway.routes[1].id=USER-SERVICE-AUTH
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/oauth2/**,/api/auth/**, /login/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter


spring.cloud.gateway.routes[2].id=LEARNING-PATH-GENERATOR
spring.cloud.gateway.routes[2].uri=lb://LEARNING-PATH-GENERATOR
spring.cloud.gateway.routes[2].predicates[0]=Path=/health, /api/path/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s


# =========================================
# TOKEN BUCKET RATE LIMITER
# =========================================

gateway.rate-limit.enabled=true

# Maximum bucket capacity
gateway.rate-limit.capacity=10

# 2 tokens per second
gateway.rate-limit.refill-tokens=2
gateway.rate-limit.refill-period=1s

# Every HTTP request costs 1 token
gateway.rate-limit.request-cost=1

# Bucket expiry
gateway.rate-limit.bucket-ttl=2m

# Reject requests if Redis fails
gateway.rate-limit.fail-open=false

gateway.rate-limit.key-prefix=aitutor:gateway:rate-limit

# Excluded endpoints
gateway.rate-limit.excluded-paths[0]=/health
gateway.rate-limit.excluded-paths[1]=/actuator/health
gateway.rate-limit.excluded-paths[2]=/eureka

# =========================================
# METRICS
# =========================================

management.server.port=5051
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true


eureka.instance.prefer-ip-address=true