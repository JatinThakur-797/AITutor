spring.application.name=AI-Service
server.port=${SERVER_PORT:8083}
spring.config.import=optional:file:.env[.properties]

spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${GROQ_PRIMARY_MODEL:${AI_MODEL:llama-3.3-70b-versatile}}
ai.groq.primary-model=${GROQ_PRIMARY_MODEL:${AI_MODEL:llama-3.3-70b-versatile}}
ai.groq.fallback-models=${GROQ_FALLBACK_MODELS:llama-3.1-8b-instant,meta-llama/llama-4-scout-17b-16e-instruct}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_SERVER_URL:http://localhost:8761/eureka/}}
eureka.instance.prefer-ip-address=true

app.internal.secret=${INTERNAL_SECRET:${APP_INTERNAL_SECRET:${APP_GATEWAY_SECRET:}}}