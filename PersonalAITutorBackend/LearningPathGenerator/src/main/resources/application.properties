spring.application.name=Learning-Path-Generator
server.port=8085

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_tutor}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:Jatin@999}

spring.jpa.hibernate.ddl-auto=update

# FEIGN TIMEOUT (IMPORTANT)
feign.client.config.default.connectTimeout=50000
feign.client.config.default.readTimeout=600000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
