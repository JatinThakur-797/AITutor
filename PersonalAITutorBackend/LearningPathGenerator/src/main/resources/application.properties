spring.application.name=Learning-Path-Generator
server.port=${SERVER_PORT:8082}
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/aitutor?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USERNAME:${DB_USER:aitutor}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:${DB_PASSWORD:aitutor}}}

spring.jpa.hibernate.ddl-auto=update
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
# AI generation may take up to about a minute. The gateway timeout is 90s.
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=80000
spring.cloud.openfeign.circuitbreaker.enabled=true
youtube.api.key=${YOUTUBE_API_KEY:}
resilience4j.timelimiter.configs.default.timeoutDuration=85s
resilience4j.timelimiter.configs.default.cancelRunningFuture=true
# Optional: explicit overrides per method if needed
resilience4j.timelimiter.instances.AIClientgenerateJsonString.baseConfig=default
resilience4j.timelimiter.instances.AIClientgeneratePathString.baseConfig=default

app.internal.secret=${APP_INTERNAL_SECRET:${INTERNAL_SECRET:${APP_GATEWAY_SECRET:}}}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_SERVER_URL:http://localhost:8761/eureka/}}
eureka.instance.prefer-ip-address=true
