spring.application.name=Learning-Path-Generator
server.port=8085
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# AI generation may take up to about a minute. The gateway timeout is 90s.
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=80000
spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.timelimiter.configs.default.timeoutDuration=85s
resilience4j.timelimiter.configs.default.cancelRunningFuture=true
# Optional: explicit overrides per method if needed
resilience4j.timelimiter.instances.AIClientgenerateJsonString.baseConfig=default
resilience4j.timelimiter.instances.AIClientgeneratePathString.baseConfig=default

app.internal.secret=${APP_INTERNAL_SECRET}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
