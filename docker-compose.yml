services:
  redis:
    image: redis:7-alpine
    container_name: aitutor-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aitutor-net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: aitutor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-aitutor}
      MYSQL_USER: ${DB_USER:-aitutor}
      MYSQL_PASSWORD: ${DB_PASSWORD:-aitutor}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${DB_USER:-aitutor} -p${DB_PASSWORD:-aitutor} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - aitutor-net
    restart: unless-stopped

  service-registry:
    build: ./PersonalAITutorBackend/ServiceRegistry
    container_name: aitutor-eureka
    env_file:
      - .env
    environment:
      SERVER_PORT: 8761
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - aitutor-net
    restart: unless-stopped

  api-gateway:
    build: ./PersonalAITutorBackend/ApiGateway
    container_name: aitutor-gateway
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    ports:
      - "8080:8080"
    depends_on:
      service-registry:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s
    networks:
      - aitutor-net
    restart: unless-stopped

  user-service:
    build: ./PersonalAITutorBackend/User-Service
    container_name: aitutor-user-service
    env_file:
      - .env
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-aitutor}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-aitutor}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-aitutor}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    ports:
      - "8081:8081"
    depends_on:
      service-registry:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - aitutor-net
    restart: unless-stopped

  learning-path-service:
    build: ./PersonalAITutorBackend/LearningPathGenerator
    container_name: aitutor-learning-path-service
    env_file:
      - .env
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-aitutor}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-aitutor}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-aitutor}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    ports:
      - "8082:8082"
    depends_on:
      service-registry:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - aitutor-net
    restart: unless-stopped

  ai-service:
    build: ./PersonalAITutorBackend/AIService
    container_name: aitutor-ai-service
    env_file:
      - .env
    environment:
      SERVER_PORT: 8083
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    ports:
      - "8083:8083"
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - aitutor-net
    restart: unless-stopped

  frontend:
    build:
      context: ./PersonalAITutorFrontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: aitutor-frontend
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - aitutor-net
    restart: unless-stopped

volumes:
  mysqldata:
  redisdata:

networks:
  aitutor-net:
    driver: bridge